<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-black text-white">
    <header class="flex flex-wrap items-center gap-4 border-b border-neutral-900 bg-black px-6 py-4">
        <a href=# class="shrink-0"> <img src="assets/images/Logo CineTrack.png" alt="logo" class="h-10 w-auto"></a>
        <div class="flex flex-1 items-center gap-3 rounded-full border border-gray-700 bg-neutral-900 px-5 py-3">
        <input id="recherche" type="text" placeholder="search for movies or  series..." class="w-full bg-transparent text-gray-300 outline-none placeholder-gray-500">
        </div>
<!--filtre-->
    <div class="flex items-center gap-2">
        <button  data-type = "all" class=" filtre rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">  All </button>
        <button data-type="movie" class=" filtre rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">Movies</button>
        <button  data-type="series" class=" filtre rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">Series</button>
    </div>
    <!--photo de profil-->
    <img src="/assets/images/profil.webp" alt="photo" class="h-12 w-12   rounded-full object-cover">
    </header>
    <main>
        <section>
       <div class="h-46 w-full">
        <img src="/assets/images/breaking_bad_banner.png" alt="photo" class="h-full w-full  object-cover ">
       </div>
        </section>
       <p id="message" class="mt-6 hidden text-center text-red-500"></p>
           <p id="message" class="mt-6 hidden text-center text-red-500"></p>
      <div class="flex flex-col gap-6 p-6 lg:flex-row">

        <div class="flex-1">
            <div id="grid" class="grid grid-cols-2 gap-4 md:grid-cols-3"></div>

            <div class="mt-8 flex items-center justify-center gap-4">
                <button id="precedent" class="rounded-full border border-red-800 px-5 py-2 hover:bg-red-700 disabled:opacity-40">Précédent</button>
                <span id="info-page" class="text-sm text-gray-400">Page 1 / 1</span>
                <button id="suivant" class="rounded-full border border-red-800 px-5 py-2 hover:bg-red-700 disabled:opacity-40">Suivant</button>
            </div>
        </div>

        <aside class="w-full lg:sticky lg:top-4 lg:w-72 lg:self-start">
            <div class="rounded-xl border border-neutral-800 bg-neutral-900 p-4">
                <h2 class="text-lg font-bold">Mes Favoris</h2>
                <p id="compteur" class="mt-1 text-sm text-gray-400">0 film . 0 serie</p>
                <ul id="liste-favoris" class="mt-4 flex flex-col gap-3"></ul>
            </div>
        </aside>

      </div>

    </main>
    <div id ="modal" class="fixed inset-0 hidden items-center justify-center bg-black/80 p-4">
    <div class="relative w-full max-w-md rounded-xl bg-neutral-900 p-6">
     <button id="fermer" class="absolute right-4 top-3 text-2xl hover:text-red-600">X</button>
   
   <div id="modal-contenu"></div>
   </div>
   </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
