<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-black text-white mt-2">
    <header class="flex items-center gap-4 border-b border-neutral-900 bg-black px-6 py-4">
        <a href=# class="shrink-0"> <img src="assets/images/Logo CineTrack.png" alt="logo" class="h-10 w-auto"></a>
        <div class="flex flex-1 items-center gap-3 rounded-full border border-gray-700 bg-neutral-900 px-5 py-3">
        <input type="text" placeholder="search for movies or  series..." class="w-full bg-transparent text-gray-300 outline-none placeholder-gray-500">
        </div>
<!--filtre-->
    <div class="flex items-center gap-2">
        <button class="rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">  All </button>
        <button class="rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">Movies</button>
        <button class="rounded-full border border-red-800 px-5 py-3 text-white hover:bg-red-700">Series</button>
    </div>
    <!--photo de profil-->
    <img src="/assets/images/profil.webp" alt="photo" class="h-12 w-12 shrink-0 rounded-full object-cover">
    </header>
    <main>
        <section>
       <div class="h-46 w-full">
        <img src="/assets/images/breaking_bad_banner.png" alt="photo" class="h-full w-full  object-cover ">

       </div>
        </section>
    </main>
</body>
</html>
